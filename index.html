<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Georgy Bogachev">
    <title>Contacts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            margin: 40px auto;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #15803d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #ffffff;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f0fdf4;
            color: #166534;
            border-top: 2px solid #16a34a;
        }

        button {
            background-color: #16a34a;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #15803d;
        }

        #result {
            margin-top: 16px;
            font-weight: bold;
            color: #166534;
        }
    </style>
</head>
<body>

    <h2>Contacts</h2>

    <table>
        <thead>
            <tr>
                <th>Slot #</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>0</td>
                <td>Arnold</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Sly</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Dwayne</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Vin</td>
            </tr>
            <tr>
                <td>4</td>
                <td>JCVD</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Steven</td>
            </tr>
        </tbody>
    </table>

    <button onclick="findContact()">Select Contact</button>

    <p id="result"></p>

    <script>
    const contactList = ["Arnold", "Sly", "Dwayne", "Vin", "JCVD", "Steven"];

    function findContact() {
        let isSearching = true;

        while (isSearching) {
            const userInput = prompt("Enter the Slot Number of the name you wish to see");

            if (userInput === null || userInput === "stop" || userInput === "exit") {
                break;
            }

            const chosenIndex = parseInt(userInput.trim(), 10);

            if (chosenIndex >= 0 && chosenIndex < contactList.length) {
                const selectedContact = contactList[chosenIndex];

                alert("You selected " + selectedContact + ".");
                document.getElementById("result").innerText = "You selected " + selectedContact + ".";

                const wantsAnother = confirm("Do you wish to select another name?");

                if (!wantsAnother) {
                    isSearching = false;
                }
            } else {
                const wantsRetry = confirm("The name has not been found, do you want to try again?");

                if (!wantsRetry) {
                    isSearching = false;
                }
            }
        }
    }
</script>

</body>
</html>
